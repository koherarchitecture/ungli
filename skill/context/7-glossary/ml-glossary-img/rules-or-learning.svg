<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Two ways to make a program: rules written by hand, or a model trained on examples"><title>Two ways to make a program: rules written by hand, or a model trained on examples</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="470" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">Two ways to make a program</text><text x="40.0" y="100.0" font-size="19" font-weight="600" fill="#6B6560" text-anchor="start">Written by hand</text><rect x="40.0" y="120.0" width="250.0" height="110.0" rx="8" fill="#ECE4D8"/><rect x="40.0" y="120.0" width="250.0" height="40.0" rx="8" fill="#6B6560"/><rect x="40.0" y="150.0" width="250.0" height="10.0" rx="0" fill="#6B6560"/><text x="56.0" y="147.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">A person writes</text><text x="56.0" y="190.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">the rules, one by one</text><line x1="298.0" y1="175.0" x2="352.0" y2="175.0" stroke="#2D3436" stroke-width="2.5" marker-end="url(#a2D3436)"/><rect x="360.0" y="120.0" width="250.0" height="110.0" rx="8" fill="#ECE4D8"/><rect x="360.0" y="120.0" width="250.0" height="40.0" rx="8" fill="#6B6560"/><rect x="360.0" y="150.0" width="250.0" height="10.0" rx="0" fill="#6B6560"/><text x="376.0" y="147.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Input</text><text x="376.0" y="190.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">a new case</text><line x1="618.0" y1="175.0" x2="672.0" y2="175.0" stroke="#2D3436" stroke-width="2.5" marker-end="url(#a2D3436)"/><rect x="680.0" y="120.0" width="280.0" height="110.0" rx="8" fill="#ECE4D8"/><rect x="680.0" y="120.0" width="280.0" height="40.0" rx="8" fill="#6B6560"/><rect x="680.0" y="150.0" width="280.0" height="10.0" rx="0" fill="#6B6560"/><text x="696.0" y="147.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Output</text><text x="696.0" y="190.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">what the rules say</text><text x="40.0" y="290.0" font-size="19" font-weight="600" fill="#C75B39" text-anchor="start">Machine learning</text><rect x="40.0" y="310.0" width="250.0" height="130.0" rx="8" fill="#ECE4D8"/><rect x="40.0" y="310.0" width="250.0" height="40.0" rx="8" fill="#C75B39"/><rect x="40.0" y="340.0" width="250.0" height="10.0" rx="0" fill="#C75B39"/><text x="56.0" y="337.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Many examples</text><text x="56.0" y="380.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">each with its answer,</text><text x="56.0" y="402.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">e.g. thousands of</text><text x="56.0" y="425.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">handwritten 7s</text><line x1="298.0" y1="375.0" x2="352.0" y2="375.0" stroke="#C75B39" stroke-width="2.5" marker-end="url(#aC75B39)"/><rect x="360.0" y="310.0" width="250.0" height="130.0" rx="8" fill="#ECE4D8"/><rect x="360.0" y="310.0" width="250.0" height="40.0" rx="8" fill="#C75B39"/><rect x="360.0" y="340.0" width="250.0" height="10.0" rx="0" fill="#C75B39"/><text x="376.0" y="337.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Training</text><text x="376.0" y="380.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">finds the pattern</text><text x="376.0" y="402.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">by itself</text><line x1="618.0" y1="375.0" x2="672.0" y2="375.0" stroke="#C75B39" stroke-width="2.5" marker-end="url(#aC75B39)"/><rect x="680.0" y="310.0" width="280.0" height="130.0" rx="8" fill="#ECE4D8"/><rect x="680.0" y="310.0" width="280.0" height="40.0" rx="8" fill="#C75B39"/><rect x="680.0" y="340.0" width="280.0" height="10.0" rx="0" fill="#C75B39"/><text x="696.0" y="337.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">A model</text><text x="696.0" y="380.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">given a new case,</text><text x="696.0" y="402.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">gives a prediction</text></svg>
