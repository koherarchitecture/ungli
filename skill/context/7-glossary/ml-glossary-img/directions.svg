<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="An encoder lets a word look at every other word; a writing model lets it look only at the words before"><title>An encoder lets a word look at every other word; a writing model lets it look only at the words before</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="430" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">Which words can “out” look at?</text><text x="40.0" y="100.0" font-size="18" font-weight="700" fill="#2D3436" text-anchor="start">An encoder such as BERT: both directions</text><rect x="40.0" y="120.0" width="116.0" height="50.0" rx="6" fill="#1F6FB2"/><text x="98.0" y="152.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">the</text><rect x="172.0" y="120.0" width="116.0" height="50.0" rx="6" fill="#1F6FB2"/><text x="230.0" y="152.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">bat</text><rect x="304.0" y="120.0" width="116.0" height="50.0" rx="6" fill="#1F6FB2"/><text x="362.0" y="152.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">flew</text><rect x="436.0" y="120.0" width="116.0" height="50.0" rx="6" fill="#2D3436"/><text x="494.0" y="152.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">out</text><rect x="568.0" y="120.0" width="116.0" height="50.0" rx="6" fill="#1F6FB2"/><text x="626.0" y="152.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">of</text><rect x="700.0" y="120.0" width="116.0" height="50.0" rx="6" fill="#1F6FB2"/><text x="758.0" y="152.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">the</text><rect x="832.0" y="120.0" width="116.0" height="50.0" rx="6" fill="#1F6FB2"/><text x="890.0" y="152.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">cave</text><text x="40.0" y="250.0" font-size="18" font-weight="700" fill="#2D3436" text-anchor="start">A model that writes: only the words before</text><rect x="40.0" y="270.0" width="116.0" height="50.0" rx="6" fill="#1F6FB2"/><text x="98.0" y="302.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">the</text><rect x="172.0" y="270.0" width="116.0" height="50.0" rx="6" fill="#1F6FB2"/><text x="230.0" y="302.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">bat</text><rect x="304.0" y="270.0" width="116.0" height="50.0" rx="6" fill="#1F6FB2"/><text x="362.0" y="302.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">flew</text><rect x="436.0" y="270.0" width="116.0" height="50.0" rx="6" fill="#2D3436"/><text x="494.0" y="302.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">out</text><rect x="568.0" y="270.0" width="116.0" height="50.0" rx="6" fill="#ECE4D8"/><text x="626.0" y="302.0" font-size="19" font-weight="600" fill="#6B6560" text-anchor="middle">of</text><rect x="700.0" y="270.0" width="116.0" height="50.0" rx="6" fill="#ECE4D8"/><text x="758.0" y="302.0" font-size="19" font-weight="600" fill="#6B6560" text-anchor="middle">the</text><rect x="832.0" y="270.0" width="116.0" height="50.0" rx="6" fill="#ECE4D8"/><text x="890.0" y="302.0" font-size="19" font-weight="600" fill="#6B6560" text-anchor="middle">cave</text><text x="40.0" y="410.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">Blue: words “out” can use. Grey: words it cannot see yet, because a writing model has not written them.</text></svg>
