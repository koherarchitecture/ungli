<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 445" width="1000" height="445" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Three ways to search by meaning: an encoder, late interaction and a cross-encoder"><title>Three ways to search by meaning: an encoder, late interaction and a cross-encoder</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="445" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">Three ways to match a question with passages</text><rect x="40.0" y="80.0" width="300.0" height="90.0" rx="8" fill="#1F6FB2"/><text x="56.0" y="132.0" font-size="18" font-weight="700" fill="#F7F3ED" text-anchor="start">Encoder (as in the finder)</text><text x="370.0" y="118.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">each passage is turned into numbers once, ahead of time;</text><text x="370.0" y="140.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">the question’s numbers are compared with them: fast</text><rect x="40.0" y="190.0" width="300.0" height="90.0" rx="8" fill="#B07D12"/><text x="56.0" y="242.0" font-size="18" font-weight="700" fill="#F7F3ED" text-anchor="start">Late interaction (ColBERT)</text><text x="370.0" y="228.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">numbers kept for every word of a passage,</text><text x="370.0" y="250.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">so finer details can match</text><rect x="40.0" y="300.0" width="300.0" height="90.0" rx="8" fill="#C75B39"/><text x="56.0" y="352.0" font-size="18" font-weight="700" fill="#F7F3ED" text-anchor="start">Cross-encoder (re-ranker)</text><text x="370.0" y="338.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">reads the question and one passage together;</text><text x="370.0" y="360.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">nothing can be worked out in advance: slower</text><text x="40.0" y="425.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">In ungli the last two are used only where a measurement shows they help.</text></svg>
