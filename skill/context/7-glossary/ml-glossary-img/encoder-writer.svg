<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="An encoder turns text into numbers; a writing model turns text into more text"><title>An encoder turns text into numbers; a writing model turns text into more text</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="410" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">Two kinds of language model</text><rect x="40.0" y="90.0" width="260.0" height="110.0" rx="8" fill="#ECE4D8"/><rect x="40.0" y="90.0" width="260.0" height="40.0" rx="8" fill="#6B6560"/><rect x="40.0" y="120.0" width="260.0" height="10.0" rx="0" fill="#6B6560"/><text x="56.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Text</text><text x="56.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">“the printer</text><text x="56.0" y="182.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">cartridges are over”</text><line x1="306.0" y1="145.0" x2="356.0" y2="145.0" stroke="#1F6FB2" stroke-width="2.5" marker-end="url(#a1F6FB2)"/><rect x="362.0" y="90.0" width="200.0" height="110.0" rx="8" fill="#ECE4D8"/><rect x="362.0" y="90.0" width="200.0" height="40.0" rx="8" fill="#1F6FB2"/><rect x="362.0" y="120.0" width="200.0" height="10.0" rx="0" fill="#1F6FB2"/><text x="378.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">An encoder</text><text x="378.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">reads</text><line x1="568.0" y1="145.0" x2="618.0" y2="145.0" stroke="#1F6FB2" stroke-width="2.5" marker-end="url(#a1F6FB2)"/><rect x="624.0" y="90.0" width="336.0" height="110.0" rx="8" fill="#ECE4D8"/><rect x="624.0" y="90.0" width="336.0" height="40.0" rx="8" fill="#1F6FB2"/><rect x="624.0" y="120.0" width="336.0" height="10.0" rx="0" fill="#1F6FB2"/><text x="640.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Numbers</text><text x="640.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">0.12, −0.40, 0.07 … (768 of them)</text><text x="640.0" y="182.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">no words written</text><rect x="40.0" y="240.0" width="260.0" height="110.0" rx="8" fill="#ECE4D8"/><rect x="40.0" y="240.0" width="260.0" height="40.0" rx="8" fill="#6B6560"/><rect x="40.0" y="270.0" width="260.0" height="10.0" rx="0" fill="#6B6560"/><text x="56.0" y="267.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Text</text><text x="56.0" y="310.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">“the printer</text><text x="56.0" y="332.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">cartridges are over”</text><line x1="306.0" y1="295.0" x2="356.0" y2="295.0" stroke="#C75B39" stroke-width="2.5" marker-end="url(#aC75B39)"/><rect x="362.0" y="240.0" width="200.0" height="110.0" rx="8" fill="#ECE4D8"/><rect x="362.0" y="240.0" width="200.0" height="40.0" rx="8" fill="#C75B39"/><rect x="362.0" y="270.0" width="200.0" height="10.0" rx="0" fill="#C75B39"/><text x="378.0" y="267.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">A writing model</text><text x="378.0" y="310.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">reads, then writes</text><line x1="568.0" y1="295.0" x2="618.0" y2="295.0" stroke="#C75B39" stroke-width="2.5" marker-end="url(#aC75B39)"/><rect x="624.0" y="240.0" width="336.0" height="110.0" rx="8" fill="#ECE4D8"/><rect x="624.0" y="240.0" width="336.0" height="40.0" rx="8" fill="#C75B39"/><rect x="624.0" y="270.0" width="336.0" height="10.0" rx="0" fill="#C75B39"/><text x="640.0" y="267.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">More text</text><text x="640.0" y="310.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">“so please order new</text><text x="640.0" y="332.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">ones by Friday”</text><text x="40.0" y="390.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">In ungli none of the models writes. Each answers with a number, or with nothing.</text></svg>
