<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 455" width="1000" height="455" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Marks for a right guess, a wrong guess and I don’t know, with and without minus marks"><title>Marks for a right guess, a wrong guess and I don’t know, with and without minus marks</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="455" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">What each answer can earn</text><rect x="40.0" y="80.0" width="440.0" height="300.0" rx="8" fill="#ECE4D8"/><text x="56.0" y="112.0" font-size="19" font-weight="700" fill="#2D3436" text-anchor="start">A test with no minus marks</text><line x1="60.0" y1="260.0" x2="460.0" y2="260.0" stroke="#6B6560" stroke-width="1.5"/><rect x="80.0" y="160.0" width="90.0" height="100.0" rx="3" fill="#2E8A57"/><text x="125.0" y="150.0" font-size="18" font-weight="700" fill="#2D3436" text-anchor="middle">+1</text><text x="125.0" y="365.0" font-size="15" font-weight="400" fill="#2D3436" text-anchor="middle">guess, right</text><rect x="210.0" y="260.0" width="90.0" height="3.0" rx="3" fill="#6B6560"/><text x="255.0" y="250.0" font-size="18" font-weight="700" fill="#2D3436" text-anchor="middle">0</text><text x="255.0" y="365.0" font-size="15" font-weight="400" fill="#2D3436" text-anchor="middle">guess, wrong</text><rect x="340.0" y="260.0" width="90.0" height="3.0" rx="3" fill="#6B6560"/><text x="385.0" y="250.0" font-size="18" font-weight="700" fill="#2D3436" text-anchor="middle">0</text><text x="385.0" y="365.0" font-size="15" font-weight="400" fill="#2D3436" text-anchor="middle">“I don’t know”</text><rect x="510.0" y="80.0" width="440.0" height="300.0" rx="8" fill="#ECE4D8"/><text x="526.0" y="112.0" font-size="19" font-weight="700" fill="#2D3436" text-anchor="start">JEE Main</text><line x1="530.0" y1="260.0" x2="930.0" y2="260.0" stroke="#6B6560" stroke-width="1.5"/><rect x="550.0" y="160.0" width="90.0" height="100.0" rx="3" fill="#2E8A57"/><text x="595.0" y="150.0" font-size="18" font-weight="700" fill="#2D3436" text-anchor="middle">+4</text><text x="595.0" y="365.0" font-size="15" font-weight="400" fill="#2D3436" text-anchor="middle">guess, right</text><rect x="680.0" y="260.0" width="90.0" height="25.0" rx="3" fill="#C75B39"/><text x="725.0" y="309.0" font-size="18" font-weight="700" fill="#2D3436" text-anchor="middle">-1</text><text x="725.0" y="365.0" font-size="15" font-weight="400" fill="#2D3436" text-anchor="middle">guess, wrong</text><rect x="810.0" y="260.0" width="90.0" height="3.0" rx="3" fill="#6B6560"/><text x="855.0" y="250.0" font-size="18" font-weight="700" fill="#2D3436" text-anchor="middle">0</text><text x="855.0" y="365.0" font-size="15" font-weight="400" fill="#2D3436" text-anchor="middle">“I don’t know”</text><text x="40.0" y="415.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">With no minus marks a guess can only gain, and “I don’t know” never scores, so guessing pays.</text><text x="40.0" y="436.6" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">Kalai and colleagues (2025): nine of the ten most influential benchmarks they looked at are marked the first way.</text></svg>
