<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="A threshold on a score from 0 to 1: below the cut-off the case is don’t know, above it the answer is accepted"><title>A threshold on a score from 0 to 1: below the cut-off the case is don’t know, above it the answer is accepted</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="290" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">A threshold: a cut-off in the rules</text><rect x="40.0" y="110.0" width="570.4" height="50.0" rx="6" fill="#ECE4D8"/><rect x="610.4" y="110.0" width="349.6" height="50.0" rx="6" fill="#1F6FB2"/><line x1="610.4" y1="90.0" x2="610.4" y2="180.0" stroke="#C75B39" stroke-width="4"/><text x="610.4" y="82.0" font-size="16" font-weight="700" fill="#C75B39" text-anchor="middle">cut-off</text><text x="60.0" y="142.0" font-size="17" font-weight="600" fill="#2D3436" text-anchor="start">below: don’t know</text><text x="630.4" y="142.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">above: accepted</text><text x="40.0" y="200.0" font-size="15" font-weight="400" fill="#6B6560" text-anchor="start">0</text><text x="960.0" y="200.0" font-size="15" font-weight="400" fill="#6B6560" text-anchor="end">1</text><text x="40.0" y="240.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">In ungli the cut-off is set on examples people answered by hand,</text><text x="40.0" y="261.6" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">then checked on examples the model never saw. The position shown is only an example.</text></svg>
