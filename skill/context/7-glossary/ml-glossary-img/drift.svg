<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Drift: after a model is trained, its answers get slowly worse as the world changes"><title>Drift: after a model is trained, its answers get slowly worse as the world changes</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="430" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">Drift: the world moves, the model stays</text><rect x="100.0" y="90.0" width="820.0" height="260.0" rx="8" fill="#ECE4D8"/><polyline points="120.0,130.0 300.0,132.0 500.0,160.0 700.0,220.0 900.0,290.0" fill="none" stroke="#C75B39" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="300.0" y1="90.0" x2="300.0" y2="350.0" stroke="#2D3436" stroke-width="2"/><text x="308.0" y="112.0" font-size="15" font-weight="600" fill="#2D3436" text-anchor="start">model trained</text><text x="350.0" y="265.0" font-size="16" font-weight="600" fill="#C75B39" text-anchor="start">its answers get slowly worse</text><text x="510.0" y="380.0" font-size="16" font-weight="600" fill="#6B6560" text-anchor="middle">time</text><text transform="translate(70,220.0) rotate(-90)" font-size="16" fill="#6B6560" font-weight="600" text-anchor="middle">how well it works</text><text x="40.0" y="410.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">Drawn to show the idea, not measured. In SDC, “drift under pressure” is a person’s standard shifting instead.</text></svg>
