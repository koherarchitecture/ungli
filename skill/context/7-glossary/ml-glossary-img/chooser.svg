<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="A chooser answers with the number of an item on a list written in advance, or with nothing"><title>A chooser answers with the number of an item on a list written in advance, or with nothing</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="260" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">A chooser picks from a list written in advance</text><rect x="40.0" y="80.0" width="400.0" height="160.0" rx="8" fill="#ECE4D8"/><text x="56.0" y="110.0" font-size="16" font-weight="600" fill="#6B6560" text-anchor="start">the list, written by people</text><rect x="56.0" y="126.0" width="36.0" height="36.0" rx="6" fill="#2D3436"/><text x="74.0" y="150.0" font-size="18" font-weight="700" fill="#F7F3ED" text-anchor="middle">1</text><text x="106.0" y="150.0" font-size="18" font-weight="400" fill="#2D3436" text-anchor="start">complete</text><rect x="56.0" y="178.0" width="36.0" height="36.0" rx="6" fill="#2D3436"/><text x="74.0" y="202.0" font-size="18" font-weight="700" fill="#F7F3ED" text-anchor="middle">2</text><text x="106.0" y="202.0" font-size="18" font-weight="400" fill="#2D3436" text-anchor="start">not complete</text><line x1="450.0" y1="140.0" x2="520.0" y2="140.0" stroke="#1F6FB2" stroke-width="2.5" marker-end="url(#a1F6FB2)"/><rect x="528.0" y="118.0" width="60.0" height="44.0" rx="6" fill="#1F6FB2"/><text x="558.0" y="148.0" font-size="20" font-weight="700" fill="#F7F3ED" text-anchor="middle">2</text><text x="604.0" y="148.0" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">an item’s number</text><line x1="450.0" y1="200.0" x2="520.0" y2="200.0" stroke="#C75B39" stroke-width="2.5" marker-end="url(#aC75B39)"/><rect x="528.0" y="178.0" width="130.0" height="44.0" rx="6" fill="#C75B39"/><text x="542.0" y="208.0" font-size="18" font-weight="700" fill="#F7F3ED" text-anchor="start">nothing</text><text x="674.0" y="208.0" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">when none fits</text></svg>
