<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="One seed run twice gives the same result; five seeds give results close to each other"><title>One seed run twice gives the same result; five seeds give results close to each other</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="250" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">The same seed, or different seeds</text><text x="40.0" y="98.0" font-size="18" font-weight="700" fill="#2D3436" text-anchor="start">seed 42, twice</text><rect x="220.0" y="78.0" width="300.0" height="30.0" rx="4" fill="#D9D0C3"/><circle cx="400" cy="93" r="10" fill="#1F6FB2"/><circle cx="400" cy="93" r="5" fill="#F7F3ED"/><text x="540.0" y="99.0" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">the same model, the same result (usually)</text><text x="40.0" y="168.0" font-size="18" font-weight="700" fill="#2D3436" text-anchor="start">five seeds</text><rect x="220.0" y="148.0" width="300.0" height="30.0" rx="4" fill="#D9D0C3"/><circle cx="372" cy="163" r="10" fill="#C75B39" opacity="0.85"/><circle cx="386" cy="163" r="10" fill="#C75B39" opacity="0.85"/><circle cx="401" cy="163" r="10" fill="#C75B39" opacity="0.85"/><circle cx="412" cy="163" r="10" fill="#C75B39" opacity="0.85"/><circle cx="428" cy="163" r="10" fill="#C75B39" opacity="0.85"/><text x="540.0" y="169.0" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">slightly different models, close results</text><text x="40.0" y="230.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">A result that holds over several seeds is less likely to be luck. Positions drawn to show the idea, not measured.</text></svg>
