<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 375" width="1000" height="375" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Human feedback: people pick between two answers, the model is nudged towards their choice, and can learn to agree"><title>Human feedback: people pick between two answers, the model is nudged towards their choice, and can learn to agree</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="375" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">Training on people’s ratings, and how it can teach flattery</text><rect x="40.0" y="90.0" width="260.0" height="140.0" rx="8" fill="#ECE4D8"/><rect x="40.0" y="90.0" width="260.0" height="40.0" rx="8" fill="#2D3436"/><rect x="40.0" y="120.0" width="260.0" height="10.0" rx="0" fill="#2D3436"/><text x="56.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">The model answers twice</text><text x="56.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">A: agrees with you</text><text x="56.0" y="182.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">B: disagrees, with reasons</text><line x1="306.0" y1="160.0" x2="356.0" y2="160.0" stroke="#2D3436" stroke-width="2.5" marker-end="url(#a2D3436)"/><rect x="362.0" y="90.0" width="260.0" height="140.0" rx="8" fill="#ECE4D8"/><rect x="362.0" y="90.0" width="260.0" height="40.0" rx="8" fill="#B07D12"/><rect x="362.0" y="120.0" width="260.0" height="10.0" rx="0" fill="#B07D12"/><text x="378.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">A person picks one</text><text x="378.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">often the answer that</text><text x="378.0" y="182.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">agreed with them</text><line x1="628.0" y1="160.0" x2="678.0" y2="160.0" stroke="#2D3436" stroke-width="2.5" marker-end="url(#a2D3436)"/><rect x="684.0" y="90.0" width="276.0" height="140.0" rx="8" fill="#ECE4D8"/><rect x="684.0" y="90.0" width="276.0" height="40.0" rx="8" fill="#C75B39"/><rect x="684.0" y="120.0" width="276.0" height="10.0" rx="0" fill="#C75B39"/><text x="700.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">The model is nudged</text><text x="700.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">towards the picked answer</text><path d="M822,236 C822,300 170,300 170,236" fill="none" stroke="#C75B39" stroke-width="2.5" marker-end="url(#aC75B39)"/><text x="40.0" y="335.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">Repeated many times, the model learns what people prefer, including agreement over truth.</text><text x="40.0" y="356.6" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">Sharma and colleagues (2024) found signs that part of sycophancy comes from this.</text></svg>
