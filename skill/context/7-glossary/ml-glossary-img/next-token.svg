<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="A language model writing one token at a time: late, again, today, and a full stop"><title>A language model writing one token at a time: late, again, today, and a full stop</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="390" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">A large language model writes one token at a time</text><rect x="40.0" y="80.0" width="246.0" height="44.0" rx="6" fill="#ECE4D8"/><text x="163.0" y="109.0" font-size="18" font-weight="600" fill="#2D3436" text-anchor="middle">The train is running</text><rect x="294.0" y="80.0" width="70.0" height="44.0" rx="6" fill="#C75B39"/><text x="329.0" y="109.0" font-size="18" font-weight="600" fill="#F7F3ED" text-anchor="middle">late</text><text x="382.0" y="109.0" font-size="15" font-weight="400" fill="#6B6560" text-anchor="start">step 1: add the likeliest next token</text><rect x="40.0" y="146.0" width="246.0" height="44.0" rx="6" fill="#ECE4D8"/><text x="163.0" y="175.0" font-size="18" font-weight="600" fill="#2D3436" text-anchor="middle">The train is running</text><rect x="294.0" y="146.0" width="70.0" height="44.0" rx="6" fill="#ECE4D8"/><text x="329.0" y="175.0" font-size="18" font-weight="600" fill="#2D3436" text-anchor="middle">late</text><rect x="372.0" y="146.0" width="81.0" height="44.0" rx="6" fill="#C75B39"/><text x="412.5" y="175.0" font-size="18" font-weight="600" fill="#F7F3ED" text-anchor="middle">again</text><text x="471.0" y="175.0" font-size="15" font-weight="400" fill="#6B6560" text-anchor="start">step 2: add the likeliest next token</text><rect x="40.0" y="212.0" width="246.0" height="44.0" rx="6" fill="#ECE4D8"/><text x="163.0" y="241.0" font-size="18" font-weight="600" fill="#2D3436" text-anchor="middle">The train is running</text><rect x="294.0" y="212.0" width="70.0" height="44.0" rx="6" fill="#ECE4D8"/><text x="329.0" y="241.0" font-size="18" font-weight="600" fill="#2D3436" text-anchor="middle">late</text><rect x="372.0" y="212.0" width="81.0" height="44.0" rx="6" fill="#ECE4D8"/><text x="412.5" y="241.0" font-size="18" font-weight="600" fill="#2D3436" text-anchor="middle">again</text><rect x="461.0" y="212.0" width="81.0" height="44.0" rx="6" fill="#C75B39"/><text x="501.5" y="241.0" font-size="18" font-weight="600" fill="#F7F3ED" text-anchor="middle">today</text><text x="560.0" y="241.0" font-size="15" font-weight="400" fill="#6B6560" text-anchor="start">step 3: add the likeliest next token</text><rect x="40.0" y="278.0" width="246.0" height="44.0" rx="6" fill="#ECE4D8"/><text x="163.0" y="307.0" font-size="18" font-weight="600" fill="#2D3436" text-anchor="middle">The train is running</text><rect x="294.0" y="278.0" width="70.0" height="44.0" rx="6" fill="#ECE4D8"/><text x="329.0" y="307.0" font-size="18" font-weight="600" fill="#2D3436" text-anchor="middle">late</text><rect x="372.0" y="278.0" width="81.0" height="44.0" rx="6" fill="#ECE4D8"/><text x="412.5" y="307.0" font-size="18" font-weight="600" fill="#2D3436" text-anchor="middle">again</text><rect x="461.0" y="278.0" width="81.0" height="44.0" rx="6" fill="#ECE4D8"/><text x="501.5" y="307.0" font-size="18" font-weight="600" fill="#2D3436" text-anchor="middle">today</text><rect x="550.0" y="278.0" width="37.0" height="44.0" rx="6" fill="#C75B39"/><text x="568.5" y="307.0" font-size="18" font-weight="600" fill="#F7F3ED" text-anchor="middle">.</text><text x="605.0" y="307.0" font-size="15" font-weight="400" fill="#6B6560" text-anchor="start">step 4: add the likeliest next token</text><text x="40.0" y="370.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">Each new token is chosen from what came before, then becomes part of what the next one is chosen from.</text></svg>
