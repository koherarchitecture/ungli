<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="A pointer answers when was the file received with sentence 1, and who will examine the matter with nothing"><title>A pointer answers when was the file received with sentence 1, and who will examine the matter with nothing</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="330" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">A pointer answers with a number, or with nothing</text><rect x="40.0" y="80.0" width="520.0" height="190.0" rx="8" fill="#ECE4D8"/><rect x="56.0" y="98.0" width="40.0" height="40.0" rx="6" fill="#2D3436"/><text x="76.0" y="125.0" font-size="19" font-weight="700" fill="#F7F3ED" text-anchor="middle">1</text><text x="110.0" y="125.0" font-size="18" font-weight="400" fill="#2D3436" text-anchor="start">The file was received on Monday.</text><rect x="56.0" y="154.0" width="40.0" height="40.0" rx="6" fill="#2D3436"/><text x="76.0" y="181.0" font-size="19" font-weight="700" fill="#F7F3ED" text-anchor="middle">2</text><text x="110.0" y="181.0" font-size="18" font-weight="400" fill="#2D3436" text-anchor="start">The matter will be examined.</text><rect x="56.0" y="210.0" width="40.0" height="40.0" rx="6" fill="#2D3436"/><text x="76.0" y="237.0" font-size="19" font-weight="700" fill="#F7F3ED" text-anchor="middle">3</text><text x="110.0" y="237.0" font-size="18" font-weight="400" fill="#2D3436" text-anchor="start">A reply will be sent in due course.</text><text x="600.0" y="106.0" font-size="18" font-weight="600" fill="#2D3436" text-anchor="start">When was the file received?</text><line x1="600.0" y1="130.0" x2="660.0" y2="130.0" stroke="#1F6FB2" stroke-width="2.5" marker-end="url(#a1F6FB2)"/><rect x="668.0" y="110.0" width="60.0" height="40.0" rx="6" fill="#1F6FB2"/><text x="678.0" y="137.0" font-size="18" font-weight="700" fill="#F7F3ED" text-anchor="start">1</text><text x="600.0" y="206.0" font-size="18" font-weight="600" fill="#2D3436" text-anchor="start">Who will examine the matter?</text><line x1="600.0" y1="230.0" x2="660.0" y2="230.0" stroke="#C75B39" stroke-width="2.5" marker-end="url(#aC75B39)"/><rect x="668.0" y="210.0" width="150.0" height="40.0" rx="6" fill="#C75B39"/><text x="678.0" y="237.0" font-size="18" font-weight="700" fill="#F7F3ED" text-anchor="start">nothing</text><text x="40.0" y="310.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">The note names nobody, so the pointer points at nothing. It cannot write a word of its own.</text></svg>
