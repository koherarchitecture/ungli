<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="A false positive flags an essay the student wrote; a false negative misses a copied one"><title>A false positive flags an essay the student wrote; a false negative misses a copied one</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="230" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">A plagiarism checker’s two mistakes</text><rect x="40.0" y="80.0" width="440.0" height="130.0" rx="8" fill="#ECE4D8"/><rect x="40.0" y="80.0" width="440.0" height="40.0" rx="8" fill="#C75B39"/><rect x="40.0" y="110.0" width="440.0" height="10.0" rx="0" fill="#C75B39"/><text x="56.0" y="107.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">False positive: a wrong “yes”</text><text x="56.0" y="150.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">flags an essay the student</text><text x="56.0" y="172.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">wrote herself</text><rect x="510.0" y="80.0" width="440.0" height="130.0" rx="8" fill="#ECE4D8"/><rect x="510.0" y="80.0" width="440.0" height="40.0" rx="8" fill="#B07D12"/><rect x="510.0" y="110.0" width="440.0" height="10.0" rx="0" fill="#B07D12"/><text x="526.0" y="107.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">False negative: a wrong “no”</text><text x="526.0" y="150.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">misses an essay that</text><text x="526.0" y="172.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">was copied</text></svg>
