<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="A base model, saved at checkpoints during its training, from which rai’s and RAM’s readers are both fine-tuned"><title>A base model, saved at checkpoints during its training, from which rai’s and RAM’s readers are both fine-tuned</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="290" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">One base model, two readers</text><text x="40.0" y="98.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">checkpoints: copies saved during training</text><line x1="40.0" y1="130.0" x2="420.0" y2="130.0" stroke="#2D3436" stroke-width="3"/><circle cx="60" cy="130" r="9" fill="#F7F3ED" stroke="#2D3436" stroke-width="3"/><circle cx="145" cy="130" r="9" fill="#F7F3ED" stroke="#2D3436" stroke-width="3"/><circle cx="230" cy="130" r="9" fill="#F7F3ED" stroke="#2D3436" stroke-width="3"/><circle cx="315" cy="130" r="9" fill="#F7F3ED" stroke="#2D3436" stroke-width="3"/><circle cx="400" cy="130" r="9" fill="#F7F3ED" stroke="#2D3436" stroke-width="3"/><line x1="424.0" y1="130.0" x2="470.0" y2="130.0" stroke="#2D3436" stroke-width="2.5" marker-end="url(#a2D3436)"/><rect x="476.0" y="90.0" width="200.0" height="80.0" rx="8" fill="#ECE4D8"/><rect x="476.0" y="90.0" width="200.0" height="40.0" rx="8" fill="#2D3436"/><rect x="476.0" y="120.0" width="200.0" height="10.0" rx="0" fill="#2D3436"/><text x="492.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Base model</text><text x="492.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">someone else trained</text><line x1="680.0" y1="120.0" x2="740.0" y2="85.0" stroke="#1F6FB2" stroke-width="2.5" marker-end="url(#a1F6FB2)"/><line x1="680.0" y1="140.0" x2="740.0" y2="185.0" stroke="#C75B39" stroke-width="2.5" marker-end="url(#aC75B39)"/><rect x="746.0" y="50.0" width="214.0" height="80.0" rx="8" fill="#ECE4D8"/><rect x="746.0" y="50.0" width="214.0" height="40.0" rx="8" fill="#1F6FB2"/><rect x="746.0" y="80.0" width="214.0" height="10.0" rx="0" fill="#1F6FB2"/><text x="762.0" y="77.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">rai’s reader</text><text x="762.0" y="120.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">fine-tuned from it</text><rect x="746.0" y="150.0" width="214.0" height="80.0" rx="8" fill="#ECE4D8"/><rect x="746.0" y="150.0" width="214.0" height="40.0" rx="8" fill="#C75B39"/><rect x="746.0" y="180.0" width="214.0" height="10.0" rx="0" fill="#C75B39"/><text x="762.0" y="177.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">RAM’s reader</text><text x="762.0" y="220.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">fine-tuned from it</text><text x="40.0" y="270.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">Starting from a base model saves training from nothing; the readers in rai and RAM share the same base.</text></svg>
