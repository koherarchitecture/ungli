<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Temperature: at 0.3 the word late gets almost all the chance; at 2 the four words are closer"><title>Temperature: at 0.3 the word late gets almost all the chance; at 2 the four words are closer</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="480" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start" font-style="italic">The train is running ___</text><text x="40.0" y="80.0" font-size="17" font-weight="400" fill="#6B6560" text-anchor="start">How likely each next word is at three temperatures</text><rect x="40.0" y="105.0" width="300.0" height="300.0" rx="8" fill="#ECE4D8"/><text x="56.0" y="135.0" font-size="18" font-weight="700" fill="#2D3436" text-anchor="start">temperature 0.3</text><text x="56.0" y="182.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">late</text><rect x="140.0" y="164.0" width="138.8" height="26.0" rx="3" fill="#1F6FB2"/><text x="286.8" y="184.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="start">93%</text><text x="56.0" y="240.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">on time</text><rect x="140.0" y="222.0" width="9.6" height="26.0" rx="3" fill="#1F6FB2"/><text x="157.6" y="242.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="start">6%</text><text x="56.0" y="298.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">slow</text><rect x="140.0" y="280.0" width="3.0" height="26.0" rx="3" fill="#1F6FB2"/><text x="151.0" y="300.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="start">1%</text><text x="56.0" y="356.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">full</text><rect x="140.0" y="338.0" width="3.0" height="26.0" rx="3" fill="#1F6FB2"/><text x="151.0" y="358.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="start">0%</text><rect x="360.0" y="105.0" width="300.0" height="300.0" rx="8" fill="#ECE4D8"/><text x="376.0" y="135.0" font-size="18" font-weight="700" fill="#2D3436" text-anchor="start">temperature 1</text><text x="376.0" y="182.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">late</text><rect x="460.0" y="164.0" width="81.3" height="26.0" rx="3" fill="#1F6FB2"/><text x="549.3" y="184.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="start">54%</text><text x="376.0" y="240.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">on time</text><rect x="460.0" y="222.0" width="36.5" height="26.0" rx="3" fill="#1F6FB2"/><text x="504.5" y="242.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="start">24%</text><text x="376.0" y="298.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">slow</text><rect x="460.0" y="280.0" width="20.0" height="26.0" rx="3" fill="#1F6FB2"/><text x="488.0" y="300.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="start">13%</text><text x="376.0" y="356.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">full</text><rect x="460.0" y="338.0" width="12.2" height="26.0" rx="3" fill="#1F6FB2"/><text x="480.2" y="358.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="start">8%</text><rect x="680.0" y="105.0" width="300.0" height="300.0" rx="8" fill="#ECE4D8"/><text x="696.0" y="135.0" font-size="18" font-weight="700" fill="#2D3436" text-anchor="start">temperature 2</text><text x="696.0" y="182.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">late</text><rect x="780.0" y="164.0" width="58.7" height="26.0" rx="3" fill="#1F6FB2"/><text x="846.7" y="184.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="start">39%</text><text x="696.0" y="240.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">on time</text><rect x="780.0" y="222.0" width="39.4" height="26.0" rx="3" fill="#1F6FB2"/><text x="827.4" y="242.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="start">26%</text><text x="696.0" y="298.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">slow</text><rect x="780.0" y="280.0" width="29.2" height="26.0" rx="3" fill="#1F6FB2"/><text x="817.2" y="300.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="start">19%</text><text x="696.0" y="356.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">full</text><rect x="780.0" y="338.0" width="22.7" height="26.0" rx="3" fill="#1F6FB2"/><text x="810.7" y="358.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="start">15%</text><text x="40.0" y="440.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">Low temperature: the likeliest word nearly always wins, so the same question gets the same answer more often.</text><text x="40.0" y="461.6" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">High temperature: other words get a real chance. The four scores are made up; the arithmetic is the real one.</text></svg>
