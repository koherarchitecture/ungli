<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="A chatbot writes one reply; an agent answers and then takes further steps on its own, again and again"><title>A chatbot writes one reply; an agent answers and then takes further steps on its own, again and again</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="470" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">A chatbot answers; an agent goes on by itself</text><rect x="40.0" y="90.0" width="200.0" height="100.0" rx="8" fill="#ECE4D8"/><rect x="40.0" y="90.0" width="200.0" height="40.0" rx="8" fill="#6B6560"/><rect x="40.0" y="120.0" width="200.0" height="10.0" rx="0" fill="#6B6560"/><text x="56.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">You type</text><text x="56.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">a question</text><line x1="246.0" y1="140.0" x2="296.0" y2="140.0" stroke="#2D3436" stroke-width="2.5" marker-end="url(#a2D3436)"/><rect x="302.0" y="90.0" width="220.0" height="100.0" rx="8" fill="#ECE4D8"/><rect x="302.0" y="90.0" width="220.0" height="40.0" rx="8" fill="#2D3436"/><rect x="302.0" y="120.0" width="220.0" height="10.0" rx="0" fill="#2D3436"/><text x="318.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">The model</text><text x="318.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">writes a reply</text><text x="560.0" y="145.0" font-size="18" font-weight="600" fill="#6B6560" text-anchor="start">A chatbot stops here.</text><rect x="40.0" y="240.0" width="200.0" height="100.0" rx="8" fill="#ECE4D8"/><rect x="40.0" y="240.0" width="200.0" height="40.0" rx="8" fill="#6B6560"/><rect x="40.0" y="270.0" width="200.0" height="10.0" rx="0" fill="#6B6560"/><text x="56.0" y="267.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">You type</text><text x="56.0" y="310.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">a task</text><line x1="246.0" y1="290.0" x2="296.0" y2="290.0" stroke="#C75B39" stroke-width="2.5" marker-end="url(#aC75B39)"/><rect x="302.0" y="240.0" width="220.0" height="100.0" rx="8" fill="#ECE4D8"/><rect x="302.0" y="240.0" width="220.0" height="40.0" rx="8" fill="#C75B39"/><rect x="302.0" y="270.0" width="220.0" height="10.0" rx="0" fill="#C75B39"/><text x="318.0" y="267.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">The model</text><text x="318.0" y="310.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">answers, then</text><text x="318.0" y="332.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">picks a next step</text><line x1="528.0" y1="290.0" x2="578.0" y2="290.0" stroke="#C75B39" stroke-width="2.5" marker-end="url(#aC75B39)"/><rect x="584.0" y="240.0" width="376.0" height="100.0" rx="8" fill="#ECE4D8"/><rect x="584.0" y="240.0" width="376.0" height="40.0" rx="8" fill="#C75B39"/><rect x="584.0" y="270.0" width="376.0" height="10.0" rx="0" fill="#C75B39"/><text x="600.0" y="267.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Steps it takes on its own</text><text x="600.0" y="310.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">search the web, run code,</text><text x="600.0" y="332.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">call other programs, and again</text><path d="M772,346 C772,410 412,410 412,350" fill="none" stroke="#C75B39" stroke-width="2.5" marker-end="url(#aC75B39)"/><text x="40.0" y="450.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">In ungli, a model that plans the order of steps, or writes a step for another model, is outside the method.</text></svg>
