<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="A house with a big door, the model’s size, and a small window, its output: a number or nothing"><title>A house with a big door, the model’s size, and a small window, its output: a number or nothing</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="450" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">The size of the window, not the door</text><rect x="60.0" y="90.0" width="520.0" height="330.0" rx="4" fill="#ECE4D8" stroke="#2D3436" stroke-width="2"/><rect x="110.0" y="190.0" width="160.0" height="230.0" rx="4" fill="#2D3436"/><text x="190.0" y="300.0" font-size="18" font-weight="700" fill="#F7F3ED" text-anchor="middle">the door</text><text x="130.0" y="335.0" font-size="14" font-weight="400" fill="#F7F3ED" text-anchor="start">the model’s</text><text x="130.0" y="353.9" font-size="14" font-weight="400" fill="#F7F3ED" text-anchor="start">own size: any</text><rect x="400.0" y="150.0" width="90.0" height="70.0" rx="4" fill="#F7F3ED" stroke="#C75B39" stroke-width="2"/><text x="445.0" y="195.0" font-size="30" font-weight="700" fill="#C75B39" text-anchor="middle">3</text><line x1="492.0" y1="185.0" x2="620.0" y2="185.0" stroke="#C75B39" stroke-width="2.5" marker-end="url(#aC75B39)"/><text x="630.0" y="175.0" font-size="20" font-weight="700" fill="#C75B39" text-anchor="start">the window</text><text x="630.0" y="205.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">what comes out of the model:</text><text x="630.0" y="227.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">a few tokens, all of them</text><text x="630.0" y="250.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">a number from a list,</text><text x="630.0" y="273.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">or nothing</text><text x="630.0" y="345.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">Code holds the window small</text><text x="630.0" y="366.6" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">when the model is called,</text><text x="630.0" y="388.2" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">and checks what comes out.</text></svg>
