<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Koher’s older tools: qualification, then rules, then a language layer that narrates the decision"><title>Koher’s older tools: qualification, then rules, then a language layer that narrates the decision</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="300" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">The three layers of Koher’s older tools</text><rect x="40.0" y="80.0" width="290.0" height="160.0" rx="8" fill="#ECE4D8"/><rect x="40.0" y="80.0" width="290.0" height="40.0" rx="8" fill="#1F6FB2"/><rect x="40.0" y="110.0" width="290.0" height="10.0" rx="0" fill="#1F6FB2"/><text x="56.0" y="107.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">1 · Qualification</text><text x="56.0" y="150.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">a model or a person</text><text x="56.0" y="172.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">reads the input and</text><text x="56.0" y="195.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">picks out signals</text><line x1="334.0" y1="160.0" x2="356.0" y2="160.0" stroke="#2D3436" stroke-width="2.5" marker-end="url(#a2D3436)"/><rect x="360.0" y="80.0" width="290.0" height="160.0" rx="8" fill="#ECE4D8"/><rect x="360.0" y="80.0" width="290.0" height="40.0" rx="8" fill="#2D3436"/><rect x="360.0" y="110.0" width="290.0" height="10.0" rx="0" fill="#2D3436"/><text x="376.0" y="107.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">2 · Rules</text><text x="376.0" y="150.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">deterministic code</text><text x="376.0" y="172.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">people wrote; the</text><text x="376.0" y="195.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">decision is made here</text><line x1="654.0" y1="160.0" x2="676.0" y2="160.0" stroke="#2D3436" stroke-width="2.5" marker-end="url(#a2D3436)"/><rect x="680.0" y="80.0" width="290.0" height="160.0" rx="8" fill="#ECE4D8"/><rect x="680.0" y="80.0" width="290.0" height="40.0" rx="8" fill="#B07D12"/><rect x="680.0" y="110.0" width="290.0" height="10.0" rx="0" fill="#B07D12"/><text x="696.0" y="107.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">3 · Language layer</text><text x="696.0" y="150.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">a model narrates the</text><text x="696.0" y="172.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">decision; a list of</text><text x="696.0" y="195.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">forbidden strings checks it</text><text x="40.0" y="280.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">In Koher’s new work, no model writes at all.</text></svg>
