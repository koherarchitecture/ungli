<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" width="1000" height="770" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Twelve sentences on four topics, placed by an encoder: printers, rain, cricket and crops each form a group"><title>Twelve sentences on four topics, placed by an encoder: printers, rain, cricket and crops each form a group</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="770" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">Twelve sentences placed by meaning</text><text x="40.0" y="80.0" font-size="17" font-weight="400" fill="#6B6560" text-anchor="start">Each dot is one sentence, placed by an encoder. Sentences on one topic land near each other.</text><rect x="40.0" y="110.0" width="920.0" height="460.0" rx="8" fill="#ECE4D8"/><circle cx="334.8" cy="339.7" r="9" fill="#C75B39"/><circle cx="300.0" cy="317.3" r="9" fill="#C75B39"/><circle cx="379.2" cy="275.9" r="9" fill="#C75B39"/><text x="280.0" y="318.0" font-size="20" font-weight="700" fill="#C75B39" text-anchor="end">printers</text><circle cx="700.0" cy="364.9" r="9" fill="#1F6FB2"/><circle cx="667.6" cy="338.9" r="9" fill="#1F6FB2"/><circle cx="623.1" cy="297.2" r="9" fill="#1F6FB2"/><text x="720.0" y="340.7" font-size="20" font-weight="700" fill="#1F6FB2" text-anchor="start">rain</text><circle cx="477.7" cy="513.1" r="9" fill="#B07D12"/><circle cx="501.6" cy="540.0" r="9" fill="#B07D12"/><circle cx="527.7" cy="470.9" r="9" fill="#B07D12"/><text x="547.7" y="515.0" font-size="20" font-weight="700" fill="#B07D12" text-anchor="start">cricket</text><circle cx="518.5" cy="212.6" r="9" fill="#2E8A57"/><circle cx="533.8" cy="140.0" r="9" fill="#2E8A57"/><circle cx="526.2" cy="216.9" r="9" fill="#2E8A57"/><text x="553.8" y="196.8" font-size="20" font-weight="700" fill="#2E8A57" text-anchor="start">crops</text><rect x="40.0" y="590.0" width="14.0" height="14.0" rx="3" fill="#C75B39"/><text x="64.0" y="602.0" font-size="15" font-weight="400" fill="#2D3436" text-anchor="start">printers, e.g. “The printer cartridges are over.”</text><rect x="40.0" y="618.0" width="14.0" height="14.0" rx="3" fill="#1F6FB2"/><text x="64.0" y="630.0" font-size="15" font-weight="400" fill="#2D3436" text-anchor="start">rain, e.g. “Carry an umbrella, the monsoon has started.”</text><rect x="40.0" y="646.0" width="14.0" height="14.0" rx="3" fill="#B07D12"/><text x="64.0" y="658.0" font-size="15" font-weight="400" fill="#2D3436" text-anchor="start">cricket, e.g. “The umpire gave the batter out.”</text><rect x="40.0" y="674.0" width="14.0" height="14.0" rx="3" fill="#2E8A57"/><text x="64.0" y="686.0" font-size="15" font-weight="400" fill="#2D3436" text-anchor="start">crops, e.g. “The wheat needs nitrogen before it flowers.”</text><text x="40.0" y="728.0" font-size="15" font-weight="400" fill="#6B6560" text-anchor="start">Measured with bge-base-en-v1.5, which gives each sentence 768 numbers. Flattening 768 numbers to two keeps</text><text x="40.0" y="748.2" font-size="15" font-weight="400" fill="#6B6560" text-anchor="start">32% of the differences between these sentences, so distances on the page are only roughly true.</text></svg>
