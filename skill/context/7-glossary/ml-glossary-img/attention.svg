<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Attention: lines from the word bat to the other words, thickest to cave"><title>Attention: lines from the word bat to the other words, thickest to cave</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="400" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">Which other words matter for understanding “bat”?</text><path d="M225,250 C225,178 90,178 90,250" fill="none" stroke="#C75B39" stroke-width="3.1" stroke-linecap="round" opacity="0.85"/><path d="M225,250 C225,178 360,178 360,250" fill="none" stroke="#C75B39" stroke-width="7.5" stroke-linecap="round" opacity="0.85"/><path d="M225,250 C225,146 495,146 495,250" fill="none" stroke="#C75B39" stroke-width="3.8" stroke-linecap="round" opacity="0.85"/><path d="M225,250 C225,114 630,114 630,250" fill="none" stroke="#C75B39" stroke-width="2.9" stroke-linecap="round" opacity="0.85"/><path d="M225,250 C225,82 765,82 765,250" fill="none" stroke="#C75B39" stroke-width="3.1" stroke-linecap="round" opacity="0.85"/><path d="M225,250 C225,50 900,50 900,250" fill="none" stroke="#C75B39" stroke-width="13.7" stroke-linecap="round" opacity="0.85"/><rect x="35.0" y="262.0" width="110.0" height="50.0" rx="6" fill="#ECE4D8"/><text x="90.0" y="295.0" font-size="21" font-weight="600" fill="#2D3436" text-anchor="middle">the</text><rect x="170.0" y="262.0" width="110.0" height="50.0" rx="6" fill="#2D3436"/><text x="225.0" y="295.0" font-size="21" font-weight="600" fill="#F7F3ED" text-anchor="middle">bat</text><rect x="305.0" y="262.0" width="110.0" height="50.0" rx="6" fill="#ECE4D8"/><text x="360.0" y="295.0" font-size="21" font-weight="600" fill="#2D3436" text-anchor="middle">flew</text><rect x="440.0" y="262.0" width="110.0" height="50.0" rx="6" fill="#ECE4D8"/><text x="495.0" y="295.0" font-size="21" font-weight="600" fill="#2D3436" text-anchor="middle">out</text><rect x="575.0" y="262.0" width="110.0" height="50.0" rx="6" fill="#ECE4D8"/><text x="630.0" y="295.0" font-size="21" font-weight="600" fill="#2D3436" text-anchor="middle">of</text><rect x="710.0" y="262.0" width="110.0" height="50.0" rx="6" fill="#ECE4D8"/><text x="765.0" y="295.0" font-size="21" font-weight="600" fill="#2D3436" text-anchor="middle">the</text><rect x="845.0" y="262.0" width="110.0" height="50.0" rx="6" fill="#ECE4D8"/><text x="900.0" y="295.0" font-size="21" font-weight="600" fill="#2D3436" text-anchor="middle">cave</text><text x="40.0" y="360.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">A thicker line means the word counts for more. Here “cave” counts most, so this bat is an animal,</text><text x="40.0" y="381.6" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">not a cricket bat. The thicknesses are drawn by hand to show the idea; they are not measured.</text></svg>
