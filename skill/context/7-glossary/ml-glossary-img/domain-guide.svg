<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="A general encoder finds nitrogen and iron shortage equally close; a person who knows groundnut picks iron"><title>A general encoder finds nitrogen and iron shortage equally close; a person who knows groundnut picks iron</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="370" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">Close in meaning is not always the right answer</text><rect x="40.0" y="80.0" width="920.0" height="64.0" rx="8" fill="#F7F3ED" stroke="#D9D0C3" stroke-width="2"/><text x="60.0" y="120.0" font-size="18" font-weight="600" fill="#2D3436" text-anchor="start">Groundnut, on chalky soil: new leaves are yellow between the veins. Why?</text><text x="40.0" y="186.0" font-size="19" font-weight="700" fill="#1F6FB2" text-anchor="start">A general encoder</text><text x="40.0" y="210.0" font-size="15" font-weight="400" fill="#6B6560" text-anchor="start">sees both as “yellow leaves”</text><rect x="280.0" y="166.0" width="300.0" height="50.0" rx="6" fill="#1F6FB2"/><text x="296.0" y="197.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">nitrogen shortage</text><rect x="600.0" y="166.0" width="300.0" height="50.0" rx="6" fill="#1F6FB2"/><text x="616.0" y="197.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">iron shortage</text><text x="40.0" y="276.0" font-size="19" font-weight="700" fill="#2E8A57" text-anchor="start">A person who knows</text><text x="40.0" y="300.0" font-size="15" font-weight="400" fill="#6B6560" text-anchor="start">groundnut picks iron first</text><rect x="280.0" y="256.0" width="300.0" height="50.0" rx="6" fill="#ECE4D8"/><text x="296.0" y="287.0" font-size="17" font-weight="600" fill="#6B6560" text-anchor="start">nitrogen shortage</text><rect x="600.0" y="256.0" width="300.0" height="50.0" rx="6" fill="#2E8A57"/><text x="616.0" y="287.0" font-size="17" font-weight="700" fill="#F7F3ED" text-anchor="start">iron shortage</text><text x="40.0" y="350.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">A domain guide would learn this from labels such people write. No domain guide has been trained yet.</text></svg>
