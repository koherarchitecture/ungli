<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="rai found 64 of 96 real answers, missed 32, let none of 72 non-answers through and turned away all 72"><title>rai found 64 of 96 real answers, missed 32, let none of 72 non-answers through and turned away all 72</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="530" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">rai, measured: 96 real answers and 72 non-answers</text><text x="350.0" y="100.0" font-size="17" font-weight="700" fill="#2D3436" text-anchor="middle">rai said: an answer</text><text x="740.0" y="100.0" font-size="17" font-weight="700" fill="#2D3436" text-anchor="middle">rai said: not an answer</text><text x="40.0" y="175.0" font-size="17" font-weight="700" fill="#2D3436" text-anchor="start">real</text><text x="40.0" y="197.9" font-size="17" font-weight="700" fill="#2D3436" text-anchor="start">answers</text><text x="40.0" y="325.0" font-size="17" font-weight="700" fill="#2D3436" text-anchor="start">non-</text><text x="40.0" y="347.9" font-size="17" font-weight="700" fill="#2D3436" text-anchor="start">answers</text><rect x="160.0" y="115.0" width="370.0" height="135.0" rx="8" fill="#2E8A57"/><text x="184.0" y="185.0" font-size="46" font-weight="700" fill="#F7F3ED" text-anchor="start">64</text><text x="184.0" y="223.0" font-size="16" font-weight="600" fill="#F7F3ED" text-anchor="start">real answers it found</text><rect x="550.0" y="115.0" width="370.0" height="135.0" rx="8" fill="#B07D12"/><text x="574.0" y="185.0" font-size="46" font-weight="700" fill="#F7F3ED" text-anchor="start">32</text><text x="574.0" y="223.0" font-size="16" font-weight="600" fill="#F7F3ED" text-anchor="start">real answers it missed (false negatives)</text><rect x="160.0" y="265.0" width="370.0" height="135.0" rx="8" fill="#ECE4D8" stroke="#C75B39" stroke-width="2"/><text x="184.0" y="335.0" font-size="46" font-weight="700" fill="#C75B39" text-anchor="start">0</text><text x="184.0" y="373.0" font-size="16" font-weight="600" fill="#C75B39" text-anchor="start">non-answers it let through (false positives)</text><rect x="550.0" y="265.0" width="370.0" height="135.0" rx="8" fill="#1F6FB2"/><text x="574.0" y="335.0" font-size="46" font-weight="700" fill="#F7F3ED" text-anchor="start">72</text><text x="574.0" y="373.0" font-size="16" font-weight="600" fill="#F7F3ED" text-anchor="start">non-answers it turned away</text><text x="40.0" y="450.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">Recall: it found 64 of the 96 real answers, about two in three.</text><text x="40.0" y="471.6" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">Precision: of the 64 it called answers, all 64 were right, because it let no non-answer through.</text><text x="40.0" y="493.2" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">ungli would rather miss a real answer than accept a non-answer.</text></svg>
