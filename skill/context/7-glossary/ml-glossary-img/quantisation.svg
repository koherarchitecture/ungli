<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 335" width="1000" height="335" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Quantisation: 3.14159265 stored as 3.14, taking less room"><title>Quantisation: 3.14159265 stored as 3.14, taking less room</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="335" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">Quantisation: the same numbers, kept with fewer digits</text><text x="40.0" y="134.0" font-size="18" font-weight="700" fill="#2D3436" text-anchor="start">full precision</text><rect x="240.0" y="100.0" width="640.0" height="52.0" rx="6" fill="#1F6FB2"/><text x="256.0" y="135.0" font-size="22" font-weight="700" fill="#F7F3ED" text-anchor="start">3.14159265</text><text x="40.0" y="224.0" font-size="18" font-weight="700" fill="#2D3436" text-anchor="start">quantised</text><rect x="240.0" y="190.0" width="160.0" height="52.0" rx="6" fill="#B07D12"/><text x="256.0" y="225.0" font-size="22" font-weight="700" fill="#F7F3ED" text-anchor="start">3.14</text><text x="40.0" y="290.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">Every one of the millions of dials is rounded like this. The model takes less memory and runs faster,</text><text x="40.0" y="314.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">but may answer a little less well, so how much accuracy is lost has to be measured.</text></svg>
