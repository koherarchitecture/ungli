<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="People choose hyperparameters before training; training then sets the model’s parameters"><title>People choose hyperparameters before training; training then sets the model’s parameters</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="270" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">Who sets which numbers</text><rect x="40.0" y="90.0" width="280.0" height="150.0" rx="8" fill="#ECE4D8"/><rect x="40.0" y="90.0" width="280.0" height="40.0" rx="8" fill="#6B6560"/><rect x="40.0" y="120.0" width="280.0" height="10.0" rx="0" fill="#6B6560"/><text x="56.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">People choose, before</text><text x="56.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">hyperparameters:</text><text x="56.0" y="182.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">the learning rate,</text><text x="56.0" y="205.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">the number of epochs</text><line x1="326.0" y1="165.0" x2="376.0" y2="165.0" stroke="#2D3436" stroke-width="2.5" marker-end="url(#a2D3436)"/><rect x="382.0" y="90.0" width="200.0" height="150.0" rx="8" fill="#ECE4D8"/><rect x="382.0" y="90.0" width="200.0" height="40.0" rx="8" fill="#2D3436"/><rect x="382.0" y="120.0" width="200.0" height="10.0" rx="0" fill="#2D3436"/><text x="398.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Training</text><text x="398.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">runs with those</text><text x="398.0" y="182.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">settings</text><line x1="588.0" y1="165.0" x2="638.0" y2="165.0" stroke="#1F6FB2" stroke-width="2.5" marker-end="url(#a1F6FB2)"/><rect x="644.0" y="90.0" width="316.0" height="150.0" rx="8" fill="#ECE4D8"/><rect x="644.0" y="90.0" width="316.0" height="40.0" rx="8" fill="#1F6FB2"/><rect x="644.0" y="120.0" width="316.0" height="10.0" rx="0" fill="#1F6FB2"/><text x="660.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">The model learns</text><text x="660.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">parameters: the millions</text><text x="660.0" y="182.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">of dials inside it</text></svg>
