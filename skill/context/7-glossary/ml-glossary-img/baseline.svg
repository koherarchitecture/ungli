<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 335" width="1000" height="335" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="A plain parser got 162 of 178 acts right; RAM got all 178"><title>A plain parser got 162 of 178 acts right; RAM got all 178</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="335" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">Does the model add anything? Compare it with something simple</text><text x="40.0" y="132.0" font-size="18" font-weight="600" fill="#2D3436" text-anchor="start">a plain parser on its own (the baseline)</text><rect x="420.0" y="108.0" width="455.1" height="38.0" rx="4" fill="#6B6560"/><text x="865.1" y="134.0" font-size="17" font-weight="700" fill="#F7F3ED" text-anchor="end">162 of 178</text><text x="40.0" y="212.0" font-size="18" font-weight="600" fill="#2D3436" text-anchor="start">RAM</text><rect x="420.0" y="188.0" width="500.0" height="38.0" rx="4" fill="#C75B39"/><text x="910.0" y="214.0" font-size="17" font-weight="700" fill="#F7F3ED" text-anchor="end">178 of 178</text><text x="40.0" y="290.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">Acts in office notes given the right doer (or nobody, where the note named nobody), on five test sets written</text><text x="40.0" y="314.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">by models and marked by hand. Notes written by office staff have not been measured yet.</text></svg>
