<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 366" width="1000" height="366" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Two sentences split into tokens; unquestionable becomes un, quest, ion and able"><title>Two sentences split into tokens; unquestionable becomes un, quest, ion and able</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="366" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">How one encoder splits text into tokens</text><text x="40.0" y="100.0" font-size="19" font-weight="400" fill="#6B6560" text-anchor="start" font-style="italic">The umpire gave the batter out.</text><rect x="40.0" y="120.0" width="60.5" height="46.0" rx="6" fill="#1F6FB2"/><text x="70.2" y="150.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">the</text><rect x="108.5" y="120.0" width="95.0" height="46.0" rx="6" fill="#1F6FB2"/><text x="156.0" y="150.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">umpire</text><rect x="211.5" y="120.0" width="72.0" height="46.0" rx="6" fill="#1F6FB2"/><text x="247.5" y="150.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">gave</text><rect x="291.5" y="120.0" width="60.5" height="46.0" rx="6" fill="#1F6FB2"/><text x="321.8" y="150.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">the</text><rect x="360.0" y="120.0" width="95.0" height="46.0" rx="6" fill="#1F6FB2"/><text x="407.5" y="150.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">batter</text><rect x="463.0" y="120.0" width="60.5" height="46.0" rx="6" fill="#1F6FB2"/><text x="493.2" y="150.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">out</text><rect x="531.5" y="120.0" width="37.5" height="46.0" rx="6" fill="#1F6FB2"/><text x="550.2" y="150.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">.</text><text x="589.0" y="150.0" font-size="17" font-weight="600" fill="#2D3436" text-anchor="start">7 tokens</text><text x="40.0" y="220.0" font-size="19" font-weight="400" fill="#6B6560" text-anchor="start" font-style="italic">The decision was unquestionable.</text><rect x="40.0" y="240.0" width="60.5" height="46.0" rx="6" fill="#1F6FB2"/><text x="70.2" y="270.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">the</text><rect x="108.5" y="240.0" width="118.0" height="46.0" rx="6" fill="#1F6FB2"/><text x="167.5" y="270.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">decision</text><rect x="234.5" y="240.0" width="60.5" height="46.0" rx="6" fill="#1F6FB2"/><text x="264.8" y="270.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">was</text><rect x="303.0" y="240.0" width="49.0" height="46.0" rx="6" fill="#1F6FB2"/><text x="327.5" y="270.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">un</text><rect x="360.0" y="240.0" width="106.5" height="46.0" rx="6" fill="#B07D12"/><text x="413.2" y="270.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">##quest</text><rect x="474.5" y="240.0" width="83.5" height="46.0" rx="6" fill="#B07D12"/><text x="516.2" y="270.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">##ion</text><rect x="566.0" y="240.0" width="95.0" height="46.0" rx="6" fill="#B07D12"/><text x="613.5" y="270.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">##able</text><rect x="669.0" y="240.0" width="37.5" height="46.0" rx="6" fill="#1F6FB2"/><text x="687.8" y="270.0" font-size="19" font-weight="600" fill="#F7F3ED" text-anchor="middle">.</text><text x="726.5" y="270.0" font-size="17" font-weight="600" fill="#2D3436" text-anchor="start">8 tokens</text><text x="40.0" y="344.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">A blue token starts a word; an amber token (marked ##) continues the word before it.</text></svg>
