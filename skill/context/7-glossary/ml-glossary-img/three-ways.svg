<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="1000" height="310" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Supervised learning uses labelled examples; self-supervised hides a word; reinforcement learning rewards good tries"><title>Supervised learning uses labelled examples; self-supervised hides a word; reinforcement learning rewards good tries</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="310" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">Three ways a model can learn</text><rect x="40.0" y="80.0" width="295.0" height="210.0" rx="8" fill="#ECE4D8"/><rect x="40.0" y="80.0" width="295.0" height="40.0" rx="8" fill="#1F6FB2"/><rect x="40.0" y="110.0" width="295.0" height="10.0" rx="0" fill="#1F6FB2"/><text x="56.0" y="107.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Supervised</text><text x="56.0" y="150.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">each example comes</text><text x="56.0" y="172.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">with its answer:</text><rect x="56.0" y="180.0" width="263.0" height="90.0" rx="6" fill="#F7F3ED"/><text x="70.0" y="214.0" font-size="18" font-weight="600" fill="#2D3436" text-anchor="start">an email</text><text x="70.0" y="238.3" font-size="18" font-weight="600" fill="#2D3436" text-anchor="start">→ “spam”</text><rect x="355.0" y="80.0" width="295.0" height="210.0" rx="8" fill="#ECE4D8"/><rect x="355.0" y="80.0" width="295.0" height="40.0" rx="8" fill="#B07D12"/><rect x="355.0" y="110.0" width="295.0" height="10.0" rx="0" fill="#B07D12"/><text x="371.0" y="107.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Self-supervised</text><text x="371.0" y="150.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">the data supplies</text><text x="371.0" y="172.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">its own answer:</text><rect x="371.0" y="180.0" width="263.0" height="90.0" rx="6" fill="#F7F3ED"/><text x="385.0" y="214.0" font-size="18" font-weight="600" fill="#2D3436" text-anchor="start">the ___ flew out</text><text x="385.0" y="238.3" font-size="18" font-weight="600" fill="#2D3436" text-anchor="start">of the cave → bat</text><rect x="670.0" y="80.0" width="295.0" height="210.0" rx="8" fill="#ECE4D8"/><rect x="670.0" y="80.0" width="295.0" height="40.0" rx="8" fill="#C75B39"/><rect x="670.0" y="110.0" width="295.0" height="10.0" rx="0" fill="#C75B39"/><text x="686.0" y="107.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Reinforcement</text><text x="686.0" y="150.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">a try gets a score,</text><text x="686.0" y="172.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">and good tries win:</text><rect x="686.0" y="180.0" width="263.0" height="90.0" rx="6" fill="#F7F3ED"/><text x="700.0" y="214.0" font-size="18" font-weight="600" fill="#2D3436" text-anchor="start">try → score 7/10</text><text x="700.0" y="238.3" font-size="18" font-weight="600" fill="#2D3436" text-anchor="start">→ nudge towards it</text></svg>
