<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="ungli: a router sends a case through a finder, a pointer and a chooser; code checks each answer; anything else is don’t know"><title>ungli: a router sends a case through a finder, a pointer and a chooser; code checks each answer; anything else is don’t know</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="500" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">ungli: small models in layers</text><rect x="40.0" y="80.0" width="920.0" height="50.0" rx="8" fill="#2D3436"/><text x="60.0" y="112.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">The router: a table people wrote sends each kind of case through its layers, in order</text><rect x="40.0" y="160.0" width="220.0" height="150.0" rx="8" fill="#ECE4D8"/><text x="56.0" y="192.0" font-size="19" font-weight="700" fill="#2D3436" text-anchor="start">Finder</text><text x="56.0" y="222.0" font-size="15" font-weight="400" fill="#6B6560" text-anchor="start">number of the closest passage</text><text x="56.0" y="242.2" font-size="15" font-weight="400" fill="#6B6560" text-anchor="start">or nothing</text><rect x="56.0" y="262.0" width="188.0" height="34.0" rx="6" fill="#1F6FB2"/><text x="150.0" y="285.0" font-size="15" font-weight="600" fill="#F7F3ED" text-anchor="middle">code checks the answer</text><line x1="264.0" y1="235.0" x2="286.0" y2="235.0" stroke="#2D3436" stroke-width="2.5" marker-end="url(#a2D3436)"/><rect x="290.0" y="160.0" width="220.0" height="150.0" rx="8" fill="#ECE4D8"/><text x="306.0" y="192.0" font-size="19" font-weight="700" fill="#2D3436" text-anchor="start">Pointer or reader</text><text x="306.0" y="222.0" font-size="15" font-weight="400" fill="#6B6560" text-anchor="start">number of a sentence, or words</text><text x="306.0" y="242.2" font-size="15" font-weight="400" fill="#6B6560" text-anchor="start">or nothing</text><rect x="306.0" y="262.0" width="188.0" height="34.0" rx="6" fill="#1F6FB2"/><text x="400.0" y="285.0" font-size="15" font-weight="600" fill="#F7F3ED" text-anchor="middle">code checks the answer</text><line x1="514.0" y1="235.0" x2="536.0" y2="235.0" stroke="#2D3436" stroke-width="2.5" marker-end="url(#a2D3436)"/><rect x="540.0" y="160.0" width="220.0" height="150.0" rx="8" fill="#ECE4D8"/><text x="556.0" y="192.0" font-size="19" font-weight="700" fill="#2D3436" text-anchor="start">Chooser</text><text x="556.0" y="222.0" font-size="15" font-weight="400" fill="#6B6560" text-anchor="start">number of an item on a list</text><text x="556.0" y="242.2" font-size="15" font-weight="400" fill="#6B6560" text-anchor="start">or nothing</text><rect x="556.0" y="262.0" width="188.0" height="34.0" rx="6" fill="#1F6FB2"/><text x="650.0" y="285.0" font-size="15" font-weight="600" fill="#F7F3ED" text-anchor="middle">code checks the answer</text><line x1="780.0" y1="235.0" x2="800.0" y2="235.0" stroke="#2D3436" stroke-width="2.5" marker-end="url(#a2D3436)"/><rect x="806.0" y="160.0" width="154.0" height="150.0" rx="8" fill="#ECE4D8"/><rect x="806.0" y="160.0" width="154.0" height="40.0" rx="8" fill="#2E8A57"/><rect x="806.0" y="190.0" width="154.0" height="10.0" rx="0" fill="#2E8A57"/><text x="822.0" y="187.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Top call</text><text x="822.0" y="230.0" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">from a list</text><text x="822.0" y="251.6" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">written in</text><text x="822.0" y="273.2" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">advance</text><line x1="400.0" y1="312.0" x2="400.0" y2="358.0" stroke="#C75B39" stroke-width="2.5" marker-end="url(#aC75B39)"/><rect x="140.0" y="362.0" width="520.0" height="76.0" rx="8" fill="#F7F3ED" stroke="#C75B39" stroke-width="2"/><text x="160.0" y="394.0" font-size="17" font-weight="700" fill="#C75B39" text-anchor="start">Anything else, or an answer scored too low: don’t know</text><text x="160.0" y="420.0" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">the case goes to a person, or to rules people wrote in advance</text><text x="40.0" y="478.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">No model writes a word. Each answers through the window: a number, or nothing. One route is shown.</text></svg>
