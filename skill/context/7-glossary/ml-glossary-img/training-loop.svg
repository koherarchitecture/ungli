<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="One turn of training: an example, the model’s guess, the loss, a small turn of the dials, then the next example"><title>One turn of training: an example, the model’s guess, the loss, a small turn of the dials, then the next example</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="340" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">One turn of training, repeated many times</text><rect x="40.0" y="90.0" width="210.0" height="130.0" rx="8" fill="#ECE4D8"/><rect x="40.0" y="90.0" width="210.0" height="40.0" rx="8" fill="#2D3436"/><rect x="40.0" y="120.0" width="210.0" height="10.0" rx="0" fill="#2D3436"/><text x="56.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">An example</text><text x="56.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">a photo marked</text><text x="56.0" y="182.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">“mango”</text><line x1="254.0" y1="155.0" x2="266.0" y2="155.0" stroke="#2D3436" stroke-width="2.5" marker-end="url(#a2D3436)"/><rect x="270.0" y="90.0" width="210.0" height="130.0" rx="8" fill="#ECE4D8"/><rect x="270.0" y="90.0" width="210.0" height="40.0" rx="8" fill="#2D3436"/><rect x="270.0" y="120.0" width="210.0" height="10.0" rx="0" fill="#2D3436"/><text x="286.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">The model guesses</text><text x="286.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">“banana”</text><line x1="484.0" y1="155.0" x2="496.0" y2="155.0" stroke="#2D3436" stroke-width="2.5" marker-end="url(#a2D3436)"/><rect x="500.0" y="90.0" width="210.0" height="130.0" rx="8" fill="#ECE4D8"/><rect x="500.0" y="90.0" width="210.0" height="40.0" rx="8" fill="#C75B39"/><rect x="500.0" y="120.0" width="210.0" height="10.0" rx="0" fill="#C75B39"/><text x="516.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Loss</text><text x="516.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">how wrong the</text><text x="516.0" y="182.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">guess was</text><line x1="714.0" y1="155.0" x2="726.0" y2="155.0" stroke="#2D3436" stroke-width="2.5" marker-end="url(#a2D3436)"/><rect x="730.0" y="90.0" width="210.0" height="130.0" rx="8" fill="#ECE4D8"/><rect x="730.0" y="90.0" width="210.0" height="40.0" rx="8" fill="#2D3436"/><rect x="730.0" y="120.0" width="210.0" height="10.0" rx="0" fill="#2D3436"/><text x="746.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Turn the dials</text><text x="746.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">a little, so the next</text><text x="746.0" y="182.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">guess is less wrong</text><path d="M835,226 C835,300 145,300 145,232" fill="none" stroke="#C75B39" stroke-width="2.5" marker-end="url(#aC75B39)"/><text x="490.0" y="318.0" font-size="17" font-weight="600" fill="#C75B39" text-anchor="middle">next example</text></svg>
