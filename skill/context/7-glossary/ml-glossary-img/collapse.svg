<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="The collapse: one model reads and judges in one step; kept apart: signals go to rules people wrote, which give the verdict"><title>The collapse: one model reads and judges in one step; kept apart: signals go to rules people wrote, which give the verdict</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="430" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">One channel, or two</text><text x="40.0" y="98.0" font-size="19" font-weight="700" fill="#C75B39" text-anchor="start">The collapse</text><rect x="40.0" y="115.0" width="200.0" height="100.0" rx="8" fill="#ECE4D8"/><rect x="40.0" y="115.0" width="200.0" height="40.0" rx="8" fill="#6B6560"/><rect x="40.0" y="145.0" width="200.0" height="10.0" rx="0" fill="#6B6560"/><text x="56.0" y="142.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">An essay</text><text x="56.0" y="185.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">in</text><line x1="246.0" y1="165.0" x2="300.0" y2="165.0" stroke="#C75B39" stroke-width="2.5" marker-end="url(#aC75B39)"/><rect x="306.0" y="115.0" width="330.0" height="100.0" rx="8" fill="#ECE4D8"/><rect x="306.0" y="115.0" width="330.0" height="40.0" rx="8" fill="#C75B39"/><rect x="306.0" y="145.0" width="330.0" height="10.0" rx="0" fill="#C75B39"/><text x="322.0" y="142.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">A chat model</text><text x="322.0" y="185.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">reads it and judges it</text><text x="322.0" y="207.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">in one step</text><line x1="642.0" y1="165.0" x2="696.0" y2="165.0" stroke="#C75B39" stroke-width="2.5" marker-end="url(#aC75B39)"/><rect x="702.0" y="115.0" width="258.0" height="100.0" rx="8" fill="#ECE4D8"/><rect x="702.0" y="115.0" width="258.0" height="40.0" rx="8" fill="#C75B39"/><rect x="702.0" y="145.0" width="258.0" height="10.0" rx="0" fill="#C75B39"/><text x="718.0" y="142.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Verdict: “good”</text><text x="718.0" y="185.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">nobody can see why</text><text x="40.0" y="270.0" font-size="19" font-weight="700" fill="#1F6FB2" text-anchor="start">Kept apart</text><rect x="40.0" y="287.0" width="200.0" height="120.0" rx="8" fill="#ECE4D8"/><rect x="40.0" y="287.0" width="200.0" height="40.0" rx="8" fill="#1F6FB2"/><rect x="40.0" y="317.0" width="200.0" height="10.0" rx="0" fill="#1F6FB2"/><text x="56.0" y="314.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Language work</text><text x="56.0" y="357.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">a model or a person</text><text x="56.0" y="379.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">reads and describes</text><line x1="246.0" y1="347.0" x2="300.0" y2="347.0" stroke="#1F6FB2" stroke-width="2.5" marker-end="url(#a1F6FB2)"/><rect x="306.0" y="287.0" width="200.0" height="120.0" rx="8" fill="#ECE4D8"/><rect x="306.0" y="287.0" width="200.0" height="40.0" rx="8" fill="#1F6FB2"/><rect x="306.0" y="317.0" width="200.0" height="10.0" rx="0" fill="#1F6FB2"/><text x="322.0" y="314.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Signals</text><text x="322.0" y="357.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">a category, a score,</text><text x="322.0" y="379.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">an embedding</text><line x1="512.0" y1="347.0" x2="566.0" y2="347.0" stroke="#1F6FB2" stroke-width="2.5" marker-end="url(#a1F6FB2)"/><rect x="572.0" y="287.0" width="180.0" height="120.0" rx="8" fill="#ECE4D8"/><rect x="572.0" y="287.0" width="180.0" height="40.0" rx="8" fill="#2D3436"/><rect x="572.0" y="317.0" width="180.0" height="10.0" rx="0" fill="#2D3436"/><text x="588.0" y="314.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Judgement work</text><text x="588.0" y="357.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">rules people wrote,</text><text x="588.0" y="379.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">or a person</text><line x1="758.0" y1="347.0" x2="812.0" y2="347.0" stroke="#2D3436" stroke-width="2.5" marker-end="url(#a2D3436)"/><rect x="818.0" y="287.0" width="142.0" height="120.0" rx="8" fill="#ECE4D8"/><rect x="818.0" y="287.0" width="142.0" height="40.0" rx="8" fill="#2D3436"/><rect x="818.0" y="317.0" width="142.0" height="10.0" rx="0" fill="#2D3436"/><text x="834.0" y="314.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Verdict</text><text x="834.0" y="357.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">its reasons</text><text x="834.0" y="379.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">can be read</text></svg>
