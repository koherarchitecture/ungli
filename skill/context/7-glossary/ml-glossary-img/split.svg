<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Examples split into a training set, a validation set and a test set kept back until the end"><title>Examples split into a training set, a validation set and a test set kept back until the end</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="320" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">One pile of examples, split three ways</text><rect x="40.0" y="90.0" width="638.0" height="70.0" rx="6" fill="#1F6FB2"/><text x="54.0" y="133.0" font-size="19" font-weight="700" fill="#F7F3ED" text-anchor="start">Training set</text><rect x="684.0" y="90.0" width="132.0" height="70.0" rx="6" fill="#B07D12"/><text x="698.0" y="133.0" font-size="19" font-weight="700" fill="#F7F3ED" text-anchor="start">Validation</text><rect x="822.0" y="90.0" width="132.0" height="70.0" rx="6" fill="#C75B39"/><text x="836.0" y="133.0" font-size="19" font-weight="700" fill="#F7F3ED" text-anchor="start">Test set</text><rect x="40.0" y="186.0" width="16.0" height="16.0" rx="3" fill="#1F6FB2"/><text x="66.0" y="200.0" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">Training set: the model learns from these</text><rect x="40.0" y="216.0" width="16.0" height="16.0" rx="3" fill="#B07D12"/><text x="66.0" y="230.0" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">Validation: for choices while building</text><rect x="40.0" y="246.0" width="16.0" height="16.0" rx="3" fill="#C75B39"/><text x="66.0" y="260.0" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">Test set: kept back until the end</text><text x="40.0" y="300.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">ungli calls the kept-back examples held-out cases. The shares shown are only an example.</text></svg>
