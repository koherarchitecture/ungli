<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Calibration: a well calibrated model lies on the diagonal; an overconfident one falls below it"><title>Calibration: a well calibrated model lies on the diagonal; an overconfident one falls below it</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="590" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">Is the model right as often as it says?</text><rect x="140.0" y="90.0" width="420.0" height="420.0" rx="8" fill="#ECE4D8"/><line x1="140.0" y1="90.0" x2="140.0" y2="510.0" stroke="#D9D0C3" stroke-width="1.5"/><line x1="140.0" y1="510.0" x2="560.0" y2="510.0" stroke="#D9D0C3" stroke-width="1.5"/><text x="140.0" y="536.0" font-size="14" font-weight="400" fill="#6B6560" text-anchor="middle">0%</text><text x="130.0" y="515.0" font-size="14" font-weight="400" fill="#6B6560" text-anchor="end">0%</text><line x1="224.0" y1="90.0" x2="224.0" y2="510.0" stroke="#D9D0C3" stroke-width="1.5"/><line x1="140.0" y1="426.0" x2="560.0" y2="426.0" stroke="#D9D0C3" stroke-width="1.5"/><text x="224.0" y="536.0" font-size="14" font-weight="400" fill="#6B6560" text-anchor="middle">20%</text><text x="130.0" y="431.0" font-size="14" font-weight="400" fill="#6B6560" text-anchor="end">20%</text><line x1="308.0" y1="90.0" x2="308.0" y2="510.0" stroke="#D9D0C3" stroke-width="1.5"/><line x1="140.0" y1="342.0" x2="560.0" y2="342.0" stroke="#D9D0C3" stroke-width="1.5"/><text x="308.0" y="536.0" font-size="14" font-weight="400" fill="#6B6560" text-anchor="middle">40%</text><text x="130.0" y="347.0" font-size="14" font-weight="400" fill="#6B6560" text-anchor="end">40%</text><line x1="392.0" y1="90.0" x2="392.0" y2="510.0" stroke="#D9D0C3" stroke-width="1.5"/><line x1="140.0" y1="258.0" x2="560.0" y2="258.0" stroke="#D9D0C3" stroke-width="1.5"/><text x="392.0" y="536.0" font-size="14" font-weight="400" fill="#6B6560" text-anchor="middle">60%</text><text x="130.0" y="263.0" font-size="14" font-weight="400" fill="#6B6560" text-anchor="end">60%</text><line x1="476.0" y1="90.0" x2="476.0" y2="510.0" stroke="#D9D0C3" stroke-width="1.5"/><line x1="140.0" y1="174.0" x2="560.0" y2="174.0" stroke="#D9D0C3" stroke-width="1.5"/><text x="476.0" y="536.0" font-size="14" font-weight="400" fill="#6B6560" text-anchor="middle">80%</text><text x="130.0" y="179.0" font-size="14" font-weight="400" fill="#6B6560" text-anchor="end">80%</text><line x1="560.0" y1="90.0" x2="560.0" y2="510.0" stroke="#D9D0C3" stroke-width="1.5"/><line x1="140.0" y1="90.0" x2="560.0" y2="90.0" stroke="#D9D0C3" stroke-width="1.5"/><text x="560.0" y="536.0" font-size="14" font-weight="400" fill="#6B6560" text-anchor="middle">100%</text><text x="130.0" y="95.0" font-size="14" font-weight="400" fill="#6B6560" text-anchor="end">100%</text><polyline points="140.0,510.0 560.0,90.0" fill="none" stroke="#1F6FB2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="140.0,510.0 161.0,508.1 182.0,503.3 203.0,496.2 224.0,486.8 245.0,475.4 266.0,461.9 287.0,446.5 308.0,429.3 329.0,410.2 350.0,389.4 371.0,366.8 392.0,342.5 413.0,316.6 434.0,289.0 455.0,259.8 476.0,228.9 497.0,196.5 518.0,162.6 539.0,127.0 560.0,90.0" fill="none" stroke="#C75B39" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><circle cx="434.0" cy="216.0" r="9" fill="#1F6FB2"/><text x="350.0" y="566.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="middle">how sure the model says it is</text><text transform="translate(70,300.0) rotate(-90)" font-size="16" font-weight="600" fill="#2D3436" text-anchor="middle">how often it is right</text><text x="600.0" y="140.0" font-size="19" font-weight="700" fill="#1F6FB2" text-anchor="start">Well calibrated</text><text x="600.0" y="168.0" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">of the answers it gives 70%,</text><text x="600.0" y="189.6" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">about seven in ten are right</text><text x="600.0" y="290.0" font-size="19" font-weight="700" fill="#C75B39" text-anchor="start">Overconfident</text><text x="600.0" y="318.0" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">it says 70%, but is right</text><text x="600.0" y="339.6" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">less often than that</text><text x="600.0" y="440.0" font-size="15" font-weight="400" fill="#6B6560" text-anchor="start">Both lines are drawn by hand</text><text x="600.0" y="460.2" font-size="15" font-weight="400" fill="#6B6560" text-anchor="start">to show the idea; they are</text><text x="600.0" y="480.5" font-size="15" font-weight="400" fill="#6B6560" text-anchor="start">not measured from a model.</text></svg>
