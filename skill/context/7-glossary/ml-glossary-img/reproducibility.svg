<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Rules in code give the same answer three times; a chat model may give three different answers"><title>Rules in code give the same answer three times; a chat model may give three different answers</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="450" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">Run it three times</text><rect x="40.0" y="90.0" width="220.0" height="120.0" rx="8" fill="#1F6FB2"/><text x="56.0" y="156.0" font-size="19" font-weight="700" fill="#F7F3ED" text-anchor="start">Rules in code</text><line x1="266.0" y1="150.0" x2="340.0" y2="110.0" stroke="#1F6FB2" stroke-width="2" marker-end="url(#a1F6FB2)"/><rect x="346.0" y="94.0" width="280.0" height="32.0" rx="5" fill="#ECE4D8"/><text x="360.0" y="116.0" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">complete</text><line x1="266.0" y1="150.0" x2="340.0" y2="150.0" stroke="#1F6FB2" stroke-width="2" marker-end="url(#a1F6FB2)"/><rect x="346.0" y="134.0" width="280.0" height="32.0" rx="5" fill="#ECE4D8"/><text x="360.0" y="156.0" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">complete</text><line x1="266.0" y1="150.0" x2="340.0" y2="190.0" stroke="#1F6FB2" stroke-width="2" marker-end="url(#a1F6FB2)"/><rect x="346.0" y="174.0" width="280.0" height="32.0" rx="5" fill="#ECE4D8"/><text x="360.0" y="196.0" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">complete</text><rect x="40.0" y="250.0" width="220.0" height="120.0" rx="8" fill="#C75B39"/><text x="56.0" y="316.0" font-size="19" font-weight="700" fill="#F7F3ED" text-anchor="start">A chat model</text><line x1="266.0" y1="310.0" x2="340.0" y2="270.0" stroke="#C75B39" stroke-width="2" marker-end="url(#aC75B39)"/><rect x="346.0" y="254.0" width="280.0" height="32.0" rx="5" fill="#ECE4D8"/><text x="360.0" y="276.0" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">complete</text><line x1="266.0" y1="310.0" x2="340.0" y2="310.0" stroke="#C75B39" stroke-width="2" marker-end="url(#aC75B39)"/><rect x="346.0" y="294.0" width="280.0" height="32.0" rx="5" fill="#ECE4D8"/><text x="360.0" y="316.0" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">mostly complete</text><line x1="266.0" y1="310.0" x2="340.0" y2="350.0" stroke="#C75B39" stroke-width="2" marker-end="url(#aC75B39)"/><rect x="346.0" y="334.0" width="280.0" height="32.0" rx="5" fill="#ECE4D8"/><text x="360.0" y="356.0" font-size="16" font-weight="400" fill="#2D3436" text-anchor="start">needs more detail</text><text x="40.0" y="430.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">The same description, checked three times. Example answers, drawn to show the idea.</text></svg>
