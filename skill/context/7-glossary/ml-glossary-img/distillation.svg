<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Distillation: a student model half the size of its teacher kept over 99% of its accuracy on some tests"><title>Distillation: a student model half the size of its teacher kept over 99% of its accuracy on some tests</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="370" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">Distillation: a small student copies a big teacher</text><rect x="40.0" y="90.0" width="360.0" height="220.0" rx="10" fill="#1F6FB2"/><text x="220.0" y="190.0" font-size="28" font-weight="700" fill="#F7F3ED" text-anchor="middle">teacher</text><text x="220.0" y="225.0" font-size="17" font-weight="400" fill="#F7F3ED" text-anchor="middle">the bigger model</text><line x1="410.0" y1="200.0" x2="520.0" y2="200.0" stroke="#2D3436" stroke-width="2.5" marker-end="url(#a2D3436)"/><text x="465.0" y="185.0" font-size="14" font-weight="600" fill="#2D3436" text-anchor="middle">copies how it</text><text x="465.0" y="230.0" font-size="14" font-weight="600" fill="#2D3436" text-anchor="middle">pays attention</text><rect x="530.0" y="122.0" width="255.0" height="156.0" rx="10" fill="#C75B39"/><text x="657.0" y="198.0" font-size="24" font-weight="700" fill="#F7F3ED" text-anchor="middle">student</text><text x="657.0" y="226.0" font-size="15" font-weight="400" fill="#F7F3ED" text-anchor="middle">half the size</text><text x="805.0" y="175.0" font-size="17" font-weight="600" fill="#2D3436" text-anchor="start">kept over 99%</text><text x="805.0" y="197.9" font-size="17" font-weight="600" fill="#2D3436" text-anchor="start">of the teacher’s</text><text x="805.0" y="220.9" font-size="17" font-weight="600" fill="#2D3436" text-anchor="start">accuracy on</text><text x="805.0" y="243.9" font-size="17" font-weight="600" fill="#2D3436" text-anchor="start">some tests</text><text x="40.0" y="350.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">MiniLM, from Wang and colleagues (2020). Boxes drawn to the ratio of size: the student has half the parameters.</text></svg>
