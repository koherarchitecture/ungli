<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 506" width="1000" height="506" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Semantic search: the printer cartridges sentence is closest to ink for the printer, though it never says ink"><title>Semantic search: the printer cartridges sentence is closest to ink for the printer, though it never says ink</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="506" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">Searching for “ink for the printer”</text><text x="40.0" y="80.0" font-size="17" font-weight="400" fill="#6B6560" text-anchor="start">How close in meaning each sentence is to the question, from 0 to 1</text><text x="40.0" y="136.0" font-size="17" font-weight="600" fill="#2D3436" text-anchor="start">The printer cartridges are over.</text><rect x="500.0" y="116.0" width="248.0" height="30.0" rx="3" fill="#C75B39"/><text x="758.0" y="138.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="start">0.69</text><text x="40.0" y="192.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">The printer in room 4 is jammed.</text><rect x="500.0" y="172.0" width="231.8" height="30.0" rx="3" fill="#1F6FB2"/><text x="741.8" y="194.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="start">0.64</text><text x="40.0" y="248.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">Sign in ink, not pencil, on the form.</text><rect x="500.0" y="228.0" width="224.6" height="30.0" rx="3" fill="#1F6FB2"/><text x="734.6" y="250.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="start">0.62</text><text x="40.0" y="304.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">The umpire gave the batter out.</text><rect x="500.0" y="284.0" width="152.3" height="30.0" rx="3" fill="#1F6FB2"/><text x="662.3" y="306.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="start">0.42</text><text x="40.0" y="360.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">The new leaves of the groundnut are turning yellow.</text><rect x="500.0" y="340.0" width="149.8" height="30.0" rx="3" fill="#1F6FB2"/><text x="659.8" y="362.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="start">0.42</text><text x="40.0" y="416.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">Heavy rain is expected in Ahmedabad tomorrow.</text><rect x="500.0" y="396.0" width="129.2" height="30.0" rx="3" fill="#1F6FB2"/><text x="639.2" y="418.0" font-size="16" font-weight="600" fill="#2D3436" text-anchor="start">0.36</text><text x="40.0" y="466.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">The closest sentence never says “ink”. A search that matched words would have found only the form sentence.</text><text x="40.0" y="487.6" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">Measured with bge-base-en-v1.5, the encoder of csearch.</text></svg>
