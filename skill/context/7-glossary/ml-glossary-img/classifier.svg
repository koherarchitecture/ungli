<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="A classifier sorting an email into spam or not spam"><title>A classifier sorting an email into spam or not spam</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="270" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">A classifier sorts into groups chosen in advance</text><rect x="40.0" y="90.0" width="230.0" height="100.0" rx="8" fill="#ECE4D8"/><rect x="40.0" y="90.0" width="230.0" height="40.0" rx="8" fill="#6B6560"/><rect x="40.0" y="120.0" width="230.0" height="10.0" rx="0" fill="#6B6560"/><text x="56.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">An email</text><text x="56.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">“You have won …”</text><line x1="276.0" y1="140.0" x2="326.0" y2="140.0" stroke="#2D3436" stroke-width="2.5" marker-end="url(#a2D3436)"/><rect x="332.0" y="90.0" width="220.0" height="100.0" rx="8" fill="#ECE4D8"/><rect x="332.0" y="90.0" width="220.0" height="40.0" rx="8" fill="#2D3436"/><rect x="332.0" y="120.0" width="220.0" height="10.0" rx="0" fill="#2D3436"/><text x="348.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">A classifier</text><text x="348.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">a model</text><line x1="558.0" y1="125.0" x2="620.0" y2="105.0" stroke="#C75B39" stroke-width="2.5" marker-end="url(#aC75B39)"/><line x1="558.0" y1="155.0" x2="620.0" y2="175.0" stroke="#1F6FB2" stroke-width="2.5" marker-end="url(#a1F6FB2)"/><rect x="626.0" y="80.0" width="200.0" height="50.0" rx="6" fill="#C75B39"/><text x="642.0" y="112.0" font-size="18" font-weight="700" fill="#F7F3ED" text-anchor="start">spam</text><rect x="626.0" y="150.0" width="200.0" height="50.0" rx="6" fill="#ECE4D8" stroke="#1F6FB2" stroke-width="2"/><text x="642.0" y="182.0" font-size="18" font-weight="700" fill="#1F6FB2" text-anchor="start">not spam</text><text x="40.0" y="250.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">The groups exist before the model sees anything. It cannot invent a new one.</text></svg>
