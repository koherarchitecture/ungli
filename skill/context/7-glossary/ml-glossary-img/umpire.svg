<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="The commentator describes the ball, which is language work; the umpire gives the batter out, which is judgement work"><title>The commentator describes the ball, which is language work; the umpire gives the batter out, which is judgement work</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="370" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">At the cricket</text><rect x="40.0" y="80.0" width="440.0" height="170.0" rx="8" fill="#ECE4D8"/><rect x="40.0" y="80.0" width="440.0" height="40.0" rx="8" fill="#1F6FB2"/><rect x="40.0" y="110.0" width="440.0" height="10.0" rx="0" fill="#1F6FB2"/><text x="56.0" y="107.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">The commentator: language work</text><text x="56.0" y="150.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">“Full and wide, and he drives</text><text x="56.0" y="172.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">it through the covers.”</text><text x="56.0" y="195.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start"></text><text x="56.0" y="218.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">describes the ball</text><rect x="520.0" y="80.0" width="440.0" height="170.0" rx="8" fill="#ECE4D8"/><rect x="520.0" y="80.0" width="440.0" height="40.0" rx="8" fill="#2D3436"/><rect x="520.0" y="110.0" width="440.0" height="10.0" rx="0" fill="#2D3436"/><text x="536.0" y="107.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">The umpire: judgement work</text><text x="536.0" y="150.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">raises a finger: out</text><text x="536.0" y="172.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start"></text><text x="536.0" y="195.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start"></text><text x="536.0" y="218.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">decides</text><rect x="40.0" y="280.0" width="920.0" height="70.0" rx="8" fill="#F7F3ED" stroke="#C75B39" stroke-width="2"/><text x="60.0" y="322.0" font-size="16" font-weight="600" fill="#C75B39" text-anchor="start">When the commentator says “a poor shot”, the two kinds of work are mixed: SDC writes about this.</text></svg>
