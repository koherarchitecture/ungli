<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="A model on your own computer, with no fee per answer, or a hosted model reached through an API and paid per answer"><title>A model on your own computer, with no fee per answer, or a hosted model reached through an API and paid per answer</title><defs><marker id="a2D3436" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2D3436"/></marker><marker id="aC75B39" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C75B39"/></marker><marker id="a6B6560" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6560"/></marker><marker id="a1F6FB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker></defs><rect width="1000" height="300" fill="#F7F3ED"/><text x="40.0" y="50.0" font-size="26" font-weight="700" fill="#2D3436" text-anchor="start">Where the model runs</text><rect x="40.0" y="90.0" width="420.0" height="150.0" rx="8" fill="#ECE4D8"/><rect x="40.0" y="90.0" width="420.0" height="40.0" rx="8" fill="#2E8A57"/><rect x="40.0" y="120.0" width="420.0" height="10.0" rx="0" fill="#2E8A57"/><text x="56.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">On your own computer</text><text x="56.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">the model runs here</text><text x="56.0" y="182.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">no answer carries a fee</text><text x="56.0" y="205.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">what you send stays here</text><rect x="540.0" y="90.0" width="420.0" height="150.0" rx="8" fill="#ECE4D8"/><rect x="540.0" y="90.0" width="420.0" height="40.0" rx="8" fill="#B07D12"/><rect x="540.0" y="120.0" width="420.0" height="10.0" rx="0" fill="#B07D12"/><text x="556.0" y="117.0" font-size="17" font-weight="600" fill="#F7F3ED" text-anchor="start">Hosted</text><text x="556.0" y="160.0" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">the model runs on somebody else’s</text><text x="556.0" y="182.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">computers, reached over the internet</text><text x="556.0" y="205.9" font-size="17" font-weight="400" fill="#2D3436" text-anchor="start">through an API; usually paid per answer</text><text x="40.0" y="280.0" font-size="16" font-weight="400" fill="#6B6560" text-anchor="start">ungli prefers models that run on your own machine.</text></svg>
